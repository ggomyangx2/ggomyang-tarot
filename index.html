<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#2f2340" />
  <meta name="description" content="꼼양이 들려주는 귀엽고 재치 있는 오늘의 타로 운세" />
  <title>꼼양 타로 | 오늘의 운세</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Song+Myung&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <video
    id="bgVideo"
    autoplay
    muted
    loop
    playsinline>

    <source
        src="./assets/bg/stars.mp4"
        type="video/mp4"></video>
 <div class="stars"></div>
  <main class="app-shell">
    <header class="site-header">
      <p class="eyebrow">Ggomyang Daily Tarot</p>
      <h1>꼼양 타로</h1>
      <p class="subtitle">오늘, 카드가 당신에게 살짝 건네는 이야기</p>
    </header>

    <section id="introView" class="panel intro-panel">
      <div class="cat-orb" aria-hidden="true">
        <span>ฅ^•ﻌ•^ฅ</span>
      </div>
      <h2>오늘의 운세를 뽑아볼까요?</h2>
      <p>
        78장의 카드 중 한 장이 정방향 또는 역방향으로 나타나요.
        결과는 오늘 하루 동안 다시 확인할 수 있어요.
      </p>
      <button id="drawButton" class="primary-button" type="button">
        <span>오늘의 카드 뽑기</span>
        <small>살짝 눌러주세요</small>
      </button>
      <button id="restoreButton" class="text-button hidden" type="button">
        오늘 뽑은 카드 다시 보기
      </button>
    </section>

    <section id="shuffleView" class="panel shuffle-panel hidden" aria-live="polite">
      <div class="card-stack" aria-hidden="true">
        <div class="mini-card one"></div>
        <div class="mini-card two"></div>
        <div class="mini-card three"></div>
      </div>
      <h2>카드를 고르는 중이에요</h2>
      <p>꼼양이 수염을 바짝 세우고 기운을 읽고 있어요…</p>
    </section>

    <section id="resultView" class="result-view hidden" aria-live="polite">
      <article class="tarot-card-wrap">
        <div id="tarotCard" class="tarot-card">
          <div class="card-image-wrap">
            <img id="cardImage" alt="" class="card-image hidden" />
            <div id="cardFallback" class="card-fallback" aria-hidden="true">
              <span class="moon">☾</span>
              <span class="fallback-cat">ฅ</span>
              <span class="stars-mark">✦ ✧ ✦</span>
            </div>
          </div>
          <div class="card-nameplate">
            <span id="cardNumber"></span>
            <strong id="cardNameEn"></strong>
          </div>
        </div>
      </article>

      <article class="reading-sheet">
        <div class="reading-heading">
          <p id="orientationBadge" class="orientation-badge"></p>
          <h2 id="cardNameKo"></h2>
          <p id="openingLine" class="opening-line"></p>
        </div>

        <section class="reading-block">
          <h3>오늘의 키워드</h3>
          <div id="keywordList" class="keyword-list"></div>
        </section>

        <section class="reading-block">
          <h3>꼼양의 리딩</h3>
          <p id="readingText"></p>
        </section>

        <section class="reading-block caution-block">
          <h3>오늘 살짝 조심할 것</h3>
          <p id="cautionText"></p>
        </section>

        <section class="reading-block">
          <h3>오늘의 행운 포인트</h3>
          <div class="luck-grid">
            <div><span>행운색</span><strong id="luckyColor"></strong></div>
            <div><span>숫자</span><strong id="luckyNumber"></strong></div>
            <div><span>아이템</span><strong id="luckyItem"></strong></div>
          </div>
        </section>

        <section class="cat-message">
          <span class="cat-label">꼼양이 속닥속닥</span>
          <p id="catLine"></p>
        </section>

        <div class="result-actions">
          <button id="shareButton" class="secondary-button" type="button">결과 공유하기</button>
          <button id="resetButton" class="text-button danger" type="button">테스트용 기록 초기화</button>
        </div>
      </article>
    </section>
    
    <footer>
      <p>이 페이지의 타로 리딩은 가벼운 하루의 안내와 재미를 위한 콘텐츠입니다.</p>
    </footer>
  </main>

  <script src="./tarot-data.js"></script>
  <script src="./app.js"></script>
</body>
</html>
